name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm test
      - name: Check frontend entry point and syntax
        run: |
          test -s dist/index.html
          for file in dist/*.js; do node --check "$file"; done

  release:
    name: Publish static web release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Package and verify web assets
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          asset="keyplanet-${GITHUB_REF_NAME}-web.zip"
          python3 -m zipfile -c "$asset" dist LICENSE NOTICE
          python3 -m zipfile -t "$asset"
          sha256sum "$asset" > "$asset.sha256"
          sha256sum --check "$asset.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="keyplanet-${GITHUB_REF_NAME}-web.zip"
          gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sha256" \
            --verify-tag --title "KeyPlanet $GITHUB_REF_NAME" --generate-notes
